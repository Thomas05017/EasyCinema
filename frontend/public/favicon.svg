<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Cinema</title>

  <!-- Sfondo -->
  <rect width="64" height="64" rx="12" fill="#111827"/>

  <!-- Ciak -->
  <rect x="13" y="25" width="38" height="27" rx="3"
        fill="#f3f4f6"/>

  <!-- Barra superiore del ciak -->
  <path d="M10 20 L54 12 L56 22 L12 30 Z"
        fill="#ef4444"/>

  <!-- Strisce del ciak -->
  <path d="M17 18.7 L23 17.6 L25 26.7 L19 27.8 Z
           M30 16.4 L36 15.3 L38 24.4 L32 25.5 Z
           M43 14.1 L49 13 L51 22.1 L45 23.2 Z"
        fill="#f9fafb"/>

  <!-- Linee sulla lavagnetta -->
  <rect x="19" y="34" width="26" height="3" rx="1.5" fill="#111827"/>
  <rect x="19" y="42" width="18" height="3" rx="1.5" fill="#111827"/>

  <!-- Pellicola -->
  <path d="M9 54 C20 47 28 49 37 54 S52 61 57 54"
        fill="none"
        stroke="#fbbf24"
        stroke-width="5"
        stroke-linecap="round"/>

  <!-- Fori della pellicola -->
  <circle cx="14" cy="52" r="1.5" fill="#111827"/>
  <circle cx="21" cy="50" r="1.5" fill="#111827"/>
  <circle cx="29" cy="51" r="1.5" fill="#111827"/>
  <circle cx="37" cy="55" r="1.5" fill="#111827"/>
  <circle cx="45" cy="57" r="1.5" fill="#111827"/>
  <circle cx="53" cy="57" r="1.5" fill="#111827"/>
</svg>